  <!-- =====================================================
       기기 자동 감지 및 이동
  ====================================================== -->
  <script>
    (function () {

      const androidUrl =
        "https://play.google.com/store/apps/details?id=com.ybong.mdai";

      const webUrl =
        "https://app.auraspot.kr/";

      const userAgent =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera ||
        "";

      const isAndroid =
        /android/i.test(userAgent);

      const isIOSDevice =
        /iPhone|iPad|iPod/i.test(userAgent);

      const isIPadOS =
        (
          navigator.platform === "MacIntel" ||
          /Macintosh/i.test(userAgent)
        ) &&
        navigator.maxTouchPoints > 1;

      /*
       * Android → Google Play 자동 이동
       */
      if (isAndroid) {
        window.location.replace(androidUrl);
        return;
      }

      /*
       * iPhone / iPad
       * → 자동 App Store 이동하지 않음
       * → iOS 전용 다운로드 화면 표시
       */
      if (isIOSDevice || isIPadOS) {
        document.documentElement.classList.add("ios-mode");
        return;
      }

      /*
       * Windows / Mac / Linux / 기타
       * → AuraSpot Web 자동 이동
       */
      window.location.replace(webUrl);

    })();
  </script>
