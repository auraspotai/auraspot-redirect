<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- 기본 SEO -->
  <title>아우라스팟 | 내 방의 기운 | AuraSpot</title>

  <meta
    name="description"
    content="아우라스팟(AuraSpot)은 AI를 활용해 공간의 구조와 흐름을 분석하고, 공간 배치 가이드와 오늘의 아우라 콘텐츠를 제공하는 서비스입니다."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://auraspot.kr/"
  >

  <!-- 네이버 소유확인 -->
  <meta
    name="naver-site-verification"
    content="e6a566bb24f216971da9a7303e2df1dd967a45cb"
  >

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://auraspot.kr/"
  >

  <meta
    property="og:title"
    content="아우라스팟 | 내 방의 기운"
  >

  <meta
    property="og:description"
    content="AI로 내 공간의 구조와 흐름을 분석하고, 오늘의 아우라와 공간 가이드를 확인해보세요."
  >

  <meta
    property="og:site_name"
    content="AuraSpot"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: #f7f8f5;
      color: #202629;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 60px;
      text-align: center;
    }

    .brand {
      margin-bottom: 14px;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-aura {
      color: #33b86b;
    }

    .brand-spot {
      color: #36a7e8;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 34px;
      line-height: 1.35;
      letter-spacing: -1.2px;
    }

    .highlight {
      color: #40a9d9;
    }

    .description {
      max-width: 540px;
      margin: 0 auto 38px;
      color: #677075;
      font-size: 16px;
      line-height: 1.75;
    }

    .card {
      padding: 32px 24px;
      background: #ffffff;
      border: 1px solid #e7e9e5;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
    }

    .card-title {
      margin-bottom: 8px;
      font-size: 19px;
      font-weight: 700;
    }

    .card-text {
      margin-bottom: 24px;
      color: #747d81;
      font-size: 14px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: #202629;
      color: #ffffff;
    }

    .secondary {
      background: #ffffff;
      border: 1px solid #ccd2d4;
      color: #202629;
    }

    .web {
      background: #edf8f3;
      border: 1px solid #cbe9db;
      color: #25805b;
    }

    .footer {
      margin-top: 30px;
      color: #9ba1a3;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="brand">
      <span class="brand-aura">아우라</span><span class="brand-spot">스팟</span>
    </div>

    <h1>
      내 공간과 오늘의 기운을<br>
      <span class="highlight">한눈에 확인하세요</span>
    </h1>

    <p class="description">
      아우라스팟은 AI를 활용해 공간의 구조와 흐름을 분석하고,
      공간 배치 가이드와 매일 달라지는 아우라 콘텐츠를 제공합니다.
    </p>

    <section class="card">

      <div class="card-title">
        AuraSpot 시작하기
      </div>

      <div class="card-text">
        사용 중인 환경에 맞게 아우라스팟을 이용해보세요.
      </div>

      <div class="buttons">

        <a
          class="button primary"
          href="https://play.google.com/store/apps/details?id=com.ybong.mdai"
        >
          Google Play에서 다운로드
        </a>

        <a
          class="button secondary"
          href="https://apps.apple.com/kr/app/auraspot/id6760815307"
        >
          App Store에서 다운로드
        </a>

        <a
          class="button web"
          href="https://sites.google.com/view/auraspot"
        >
          AuraSpot 웹에서 둘러보기
        </a>

      </div>

    </section>

    <div class="footer">
      © AuraSpot
    </div>

  </main>

</body>
</html>
