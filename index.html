<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>아우라스팟 | AuraSpot</title>

  <!--
    auraspot.kr은 광고/다운로드 전용 주소.
    검색 노출은 info.auraspot.kr에서 담당.
  -->
  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <!-- SNS 공유용 -->
  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="아우라스팟 | AuraSpot"
  >

  <meta
    property="og:description"
    content="오늘 나에게 들어올 행운 신호를 확인해보세요."
  >

  <meta
    property="og:url"
    content="https://auraspot.kr/"
  >

  <meta
    property="og:site_name"
    content="AuraSpot"
  >

  <meta
    name="theme-color"
    content="#F7F8F5"
  >

  <!-- 기기 자동 감지 -->
  <script>
    (function () {

      const androidUrl =
        "https://play.google.com/store/apps/details?id=com.ybong.mdai";

      const iosUrl =
        "https://apps.apple.com/kr/app/auraspot/id6760815307";

      const webUrl =
        "https://sites.google.com/view/auraspot";

      const ua =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera ||
        "";

      /*
       * Android
       * Chrome, Instagram, Facebook,
       * Kakao 등 인앱 브라우저 포함
       */
      const isAndroid =
        /android/i.test(ua);

      /*
       * iPhone / iPad / iPod
       * 최신 iPadOS에서 Mac처럼 표시되는 경우도 포함
       */
      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        );

      if (isAndroid) {
        window.location.replace(androidUrl);
        return;
      }

      if (isIOS) {
        window.location.replace(iosUrl);
        return;
      }

      /*
       * Windows / Mac / Linux / 기타
       * → AuraSpot 소개 웹사이트
       */
      window.location.replace(webUrl);

    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 25% 20%,
          rgba(103, 213, 169, 0.15),
          transparent 34%
        ),
        radial-gradient(
          circle at 80% 25%,
          rgba(163, 140, 241, 0.14),
          transparent 34%
        ),
        #f7f8f5;

      color: #252a2d;
    }

    .wrap {
      width: calc(100% - 40px);
      max-width: 440px;
      text-align: center;
    }

    .brand {
      margin-bottom: 16px;
      font-size: 24px;
      font-weight: 800;
    }

    .aura {
      color: #33b86b;
    }

    .spot {
      color: #36a7e8;
    }

    .loading {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .description {
      margin-bottom: 26px;
      color: #81888b;
      font-size: 13px;
      line-height: 1.6;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 24px;

      border: 3px solid rgba(54, 167, 232, 0.13);
      border-top-color: #51b996;
      border-radius: 50%;

      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fallback {
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.82);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .fallback-title {
      margin-bottom: 14px;
      font-size: 12px;
      color: #959b9e;
    }

    .button {
      display: block;
      width: 100%;

      margin-top: 9px;
      padding: 13px 14px;

      border-radius: 11px;
      text-decoration: none;

      font-size: 13px;
      font-weight: 700;
    }

    .google {
      background: #252a2d;
      color: #ffffff;
    }

    .apple {
      border: 1px solid #d7dbdc;
      background: #ffffff;
      color: #252a2d;
    }

    .web {
      border: 1px solid #cce9dc;
      background: #edf8f3;
      color: #28805c;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="brand">
      <span class="aura">아우라</span><span class="spot">스팟</span>
    </div>

    <div class="spinner"></div>

    <div class="loading">
      AuraSpot으로 이동하고 있어요 ✨
    </div>

    <div class="description">
      사용 중인 기기에 맞는 페이지로 자동 연결됩니다.
    </div>

    <!--
      JavaScript가 차단되거나
      자동 이동이 되지 않는 경우를 위한 버튼
    -->
    <div class="fallback">

      <div class="fallback-title">
        자동으로 이동하지 않나요?
      </div>

      <a
        class="button google"
        href="https://play.google.com/store/apps/details?id=com.ybong.mdai"
      >
        Google Play에서 다운로드
      </a>

      <a
        class="button apple"
        href="https://apps.apple.com/kr/app/auraspot/id6760815307"
      >
        App Store에서 다운로드
      </a>

      <a
        class="button web"
        href="https://sites.google.com/view/auraspot"
      >
        AuraSpot 웹에서 보기
      </a>

    </div>

  </main>

</body>
</html>
